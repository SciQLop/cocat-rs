[package]
name = "cocat-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cocat-core = { path = "../cocat-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
time.workspace = true
url = "2"
uuid = { version = "1", features = ["v4"] }
yrs.workspace = true

# The view only exists in the browser; the logic modules stay native so the workspace gate
# tests them without the wasm toolchain.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
gloo-net = { version = "0.6", default-features = false, features = ["http"] }
js-sys = "0.3"
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = [
    "BinaryType",
    "Clipboard",
    "Document",
    "DomRect",
    "Element",
    "History",
    "HtmlDetailsElement",
    "HtmlDialogElement",
    "HtmlInputElement",
    "HtmlSelectElement",
    "Location",
    "MessageEvent",
    "Navigator",
    "Node",
    "PointerEvent",
    "WebSocket",
    "Window",
] }

[lints]
workspace = true
