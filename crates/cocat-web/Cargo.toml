[package]
name = "cocat-web"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
cocat-core = { path = "../cocat-core" }

# The view only exists in the browser; the logic modules stay native so the workspace gate
# tests them without the wasm toolchain.
[target.'cfg(target_arch = "wasm32")'.dependencies]
console_error_panic_hook = "0.1"
leptos = { version = "0.8", features = ["csr"] }

[lints]
workspace = true
