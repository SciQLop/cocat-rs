[package]
name = "cocat-core"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bm25 = { version = "2.3.2", default-features = false }
bytes.workspace = true
csv = "1"
geojson = { version = "1", default-features = false }
hifitime = { version = "4", default-features = false }
ignore = "0.4"
percent-encoding = "2"
quick-xml = "0.42"
regex = "1"
serde.workspace = true
serde_json.workspace = true
similar = { version = "3.2.1", default-features = false, features = ["std", "text"] }
strsim = "0.11"
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
utoipa = { version = "6", default-features = false, features = ["macros"] }
uuid = { version = "1", features = ["v4", "v5"] }
winnow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
yrs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
# std::time::Instant panics in the browser; the diff deadline reads web time there.
similar = { version = "3.2.1", features = ["wasm32_web_time"] }
time = { workspace = true, features = ["wasm-bindgen"] }
uuid = { version = "1", features = ["v4", "v5", "js"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
