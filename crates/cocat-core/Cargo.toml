[package]
name = "cocat-core"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
bytes.workspace = true
geojson = { version = "1", default-features = false }
hifitime = { version = "4", default-features = false }
percent-encoding = "2"
quick-xml = "0.42"
regex = "1"
serde.workspace = true
serde_json.workspace = true
similar = { version = "3.2.1", default-features = false, features = ["text"] }
strsim = "0.11"
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
utoipa = { version = "6", default-features = false, features = ["macros"] }
uuid = { version = "1", features = ["v4"] }
winnow = "1"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
yrs.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
time = { workspace = true, features = ["wasm-bindgen"] }
uuid = { version = "1", features = ["v4", "js"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
