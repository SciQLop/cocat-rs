[package]
name = "cocat-py"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lib]
name = "_native"
crate-type = ["cdylib"]
test = false
doctest = false

[features]
# maturin enables this; keeping it optional lets `cargo test --workspace` link libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
cocat-client = { path = "../cocat-client" }
cocat-core = { path = "../cocat-core" }
numpy = "0.30"
pyo3 = { version = "0.30", features = ["abi3-py310"] }
serde_json.workspace = true
thiserror.workspace = true
tokio = { version = "1", features = ["rt"] }
time.workspace = true
uuid = { version = "1", features = ["v4"] }
yrs.workspace = true

[lints]
workspace = true
