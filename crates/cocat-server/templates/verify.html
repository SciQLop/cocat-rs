{% extends "base.html" %}
{% block content %}
<article class="card">
<h1>Verify your address</h1>
{% match answer %}
{% when None %}
<form method="post" action="{{ action }}" data-submit-fragment>
  <input type="hidden" name="token" value="">
</form>
<p>Verifying your address…</p>
<p class="muted"><small>Nothing happens? Open the link from your inbox again.</small></p>
{% when Some with (answer) %}
<p class="{% if answer.done %}notice{% else %}error{% endif %}" role="status">{{ answer.text }}</p>
<p class="next"><a href="{{ answer.href }}" class="button">{{ answer.label }}</a></p>
{% endmatch %}
</article>
{% endblock %}
