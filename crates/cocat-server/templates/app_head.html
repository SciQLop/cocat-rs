<base href="{{ base }}">
<meta name="cocat-room" content="{{ room_id }}">
<meta name="cocat-room-name" content="{{ room_name }}">
<meta name="cocat-role" content="{{ role }}">
<meta name="cocat-ws" content="{{ socket }}">
<meta name="cocat-api" content="{{ api }}">
<meta name="cocat-user" content="{{ email }}">
<meta name="cocat-file-max" content="{{ file_max }}">
{% if admin %}<meta name="cocat-admin" content="true">
{% endif %}{% if files %}<meta name="cocat-files" content="true">
{% endif %}{% match flash %}{% when Some with (text) %}<meta name="cocat-flash" content="{{ text }}">
{% when None %}{% endmatch %}{% match share_link %}{% when Some with (link) %}<meta name="cocat-share-link" content="{{ link }}">
{% when None %}{% endmatch %}
