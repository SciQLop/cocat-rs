{% extends "base.html" %}
{% block content %}
<article class="card">
<h1>Sign in</h1>
<form method="post" action="{{ action }}">
  <label for="username">Email</label>
  <input id="username" name="username" type="email" autocomplete="username" required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password"
         autocomplete="current-password" required>
  <button type="submit">Log in</button>
  {% include "message.html" %}
</form>
<p class="links"><a href="{{ sign_up }}">Create an account</a>
&middot; <a href="{{ forgot }}">Forgot your password?</a></p>
<details>
  <summary>Didn't get the verification mail?</summary>
  <form method="post" action="{{ resend_action }}">
    <label for="resend-email">Email</label>
    <input id="resend-email" name="email" type="email" autocomplete="email" required>
    <button type="submit" class="quiet">Resend the verification mail</button>
  </form>
</details>
{% for provider in providers %}
<p><a href="{{ provider.href }}">Sign in with {{ provider.name }}</a></p>
{% endfor %}
</article>
{% endblock %}
