[package]
name = "cocat-server"
version.workspace = true
license.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
time = { version = "0.3", features = ["formatting", "parsing"] }
bcrypt = "0.15"
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["form", "ws"] }
base64 = "0.22"
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
cocat-core = { path = "../cocat-core" }
cookie = { version = "0.18", features = ["percent-encode"] }
email_address = "0.2"
form_urlencoded = "1"
futures-util = "0.3"
getrandom = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "file-transport"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
openidconnect = { version = "4.1", default-features = false, features = ["reqwest", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tikv-jemallocator = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "process"] }
tower-http = { version = "0.6", features = ["fs"] }
tungstenite = "0.30"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
utoipa = { version = "6", features = ["macros", "uuid"] }
utoipa-axum = "0.3"
utoipa-swagger-ui = { version = "10", features = ["axum", "vendored"] }
xxhash-rust = { version = "0.8", features = ["xxh3"] }
yrs.workspace = true
slug = "0.1.6"
zxcvbn = { version = "3.1.1", default-features = false }
headers = "0.4"

[dev-dependencies]
palette = "0.7"
proptest = "1"
tempfile = "3"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
