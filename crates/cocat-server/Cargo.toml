[package]
name = "cocat-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[dependencies]
argon2 = "0.6"
askama = "0.16"
axum = { version = "0.8", features = ["form", "ws"] }
base64 = "0.22"
bytes.workspace = true
clap = { version = "4", features = ["derive"] }
cocat-core = { path = "../cocat-core" }
email_address = "0.2"
futures-util = "0.3"
getrandom = "0.3"
jsonwebtoken = { version = "11", features = ["rust_crypto"] }
lettre = { version = "0.11", default-features = false, features = ["tokio1", "tokio1-rustls-tls", "smtp-transport", "builder", "file-transport"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9", features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
thiserror.workspace = true
tikv-jemallocator = "0.7"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "net", "time", "process"] }
tracing.workspace = true
url = "2"
uuid = { version = "1", features = ["serde", "v4"] }
yrs.workspace = true

[dev-dependencies]
tempfile = "3"
tokio-tungstenite = "0.30"
tower = { version = "0.5", features = ["util"] }
tracing-subscriber = "0.3"

[lints]
workspace = true
