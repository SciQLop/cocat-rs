<svg viewBox="0 0 640 220" role="img" aria-label="The browser, SciQLop and Python all sync with one cocat server; SciQLop and Python keep a copy on disk" style="width:100%;max-width:640px;height:auto" font-size="13" fill="currentColor">
<defs><marker id="arr-sync" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" style="fill:currentColor"/></marker></defs>
<rect x="20" y="20" width="180" height="44" rx="6" style="fill:var(--md-code-bg-color);stroke:currentColor"/>
<text x="110" y="42" text-anchor="middle" dominant-baseline="middle">Web browser</text>
<rect x="20" y="88" width="180" height="44" rx="6" style="fill:var(--md-code-bg-color);stroke:currentColor"/>
<text x="110" y="104" text-anchor="middle" dominant-baseline="middle">SciQLop</text>
<text x="110" y="121" text-anchor="middle" dominant-baseline="middle" font-size="11" opacity="0.75">copy on your disk</text>
<rect x="20" y="156" width="180" height="44" rx="6" style="fill:var(--md-code-bg-color);stroke:currentColor"/>
<text x="110" y="172" text-anchor="middle" dominant-baseline="middle">Python / Jupyter</text>
<text x="110" y="189" text-anchor="middle" dominant-baseline="middle" font-size="11" opacity="0.75">copy on your disk</text>
<rect x="430" y="68" width="190" height="84" rx="6" style="fill:var(--md-code-bg-color);stroke:var(--md-accent-fg-color);stroke-width:2"/>
<text x="525" y="100" text-anchor="middle" dominant-baseline="middle" font-weight="bold">cocat server</text>
<text x="525" y="122" text-anchor="middle" dominant-baseline="middle" font-size="11" opacity="0.75">projects + full history</text>
<line x1="200" y1="42" x2="430" y2="88" style="stroke:currentColor" marker-start="url(#arr-sync)" marker-end="url(#arr-sync)"/>
<line x1="200" y1="110" x2="430" y2="110" style="stroke:currentColor" marker-start="url(#arr-sync)" marker-end="url(#arr-sync)"/>
<line x1="200" y1="178" x2="430" y2="132" style="stroke:currentColor" marker-start="url(#arr-sync)" marker-end="url(#arr-sync)"/>
<text x="315" y="100" text-anchor="middle" font-size="12">every edit, within a second</text>
</svg>
