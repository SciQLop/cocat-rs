[workspace]
members = ["crates/cocat-client", "crates/cocat-core", "crates/cocat-py", "crates/cocat-server", "crates/cocat-web"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tracing = "0.1"
yrs = "0.28"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

# Dependencies are compiled with optimisations in debug builds too: password hashing is
# meant to be slow, and unoptimised it made the tests that sign many accounts up take
# minutes. Same code and strength; only the compiler setting differs. Our own crates stay
# unoptimised so they still compile fast.
[profile.dev.package."*"]
opt-level = 2
