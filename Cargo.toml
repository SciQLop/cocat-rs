[workspace]
members = ["crates/cocat-client", "crates/cocat-core", "crates/cocat-py", "crates/cocat-server"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["parsing", "formatting", "macros"] }
tracing = "0.1"
yrs = "0.28"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
