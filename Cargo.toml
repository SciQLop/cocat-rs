[workspace]
members = ["crates/cocat-core"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
publish = false

[workspace.dependencies]
bytes = "1"
thiserror = "2"
tracing = "0.1"
yrs = "0.28"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
