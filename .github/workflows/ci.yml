name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cocat-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install trunk --version 0.22.1 --locked
      # trunk downloads the wasm-bindgen that Cargo.lock pins, and wasm-opt.
      - run: trunk build --release
        working-directory: crates/cocat-web

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the abi3 wheel claims, and the version SciQLop runs.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest pytest-asyncio numpy keyring 'tscat>=0.5,<0.6'
      # The suite starts the server binary, so it has to exist before pytest runs.
      - run: cargo build --workspace
      - run: .venv/bin/maturin develop -m crates/cocat-py/Cargo.toml
      - run: .venv/bin/python -m pytest crates/cocat-py/tests tools
