name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --workspace

  windows:
    name: Windows room files
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Windows refuses some file operations Linux allows; SciQLop users open room files there.
      - run: cargo test -p cocat-core --lib "store::"

  windows-tscat:
    name: Windows tscat import
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      # SciQLop users on Windows import their old tscat catalogues.
      - run: python -m pip install ./crates/cocat-py pytest pytest-asyncio pandas polars 'tscat>=0.5,<0.6'
      - run: python -m pytest -p no:cacheprovider crates/cocat-py/tests/test_tscat.py

  web:
    name: Web bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p cocat-web --target wasm32-unknown-unknown -- -D warnings
      - run: cargo install trunk --version 0.22.1 --locked
      # The SQL engine's DuckDB-wasm and Arrow files, pinned by hash; trunk copies them.
      - run: ./fetch-duckdb.sh
        working-directory: crates/cocat-web
      # trunk downloads the wasm-bindgen that Cargo.lock pins, and wasm-opt.
      - run: trunk build --release
        working-directory: crates/cocat-web

  browser:
    name: SQL engine in a browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: python -m venv .venv
      - run: .venv/bin/pip install maturin pytest playwright
      - run: .venv/bin/python -m playwright install --with-deps --only-shell chromium
      # The tests start the server binary and write public catalogues through cocat_rs.
      - run: cargo build -p cocat-server
      - run: .venv/bin/maturin develop -m crates/cocat-py/Cargo.toml
      - run: cargo install trunk --version 0.22.1 --locked
      - run: ./fetch-duckdb.sh && trunk build
        working-directory: crates/cocat-web
      - run: .venv/bin/python -m pytest crates/cocat-web/e2e

  python:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor the abi3 wheel claims, and the version SciQLop runs.
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - run: python -m venv .venv
      # duckdb runs the survey's SQL (test_survey_sql.py), at the browser engine's version.
      # It needs Python 3.11; on 3.10 those tests skip.
      - run: .venv/bin/pip install maturin pytest pytest-asyncio numpy keyring platformdirs pandas polars 'tscat>=0.5,<0.6' 'duckdb==2.0.1; python_version >= "3.11"'
      # The suite starts the server binary, so it has to exist before pytest runs.
      - run: cargo build --workspace
      - run: .venv/bin/maturin develop -m crates/cocat-py/Cargo.toml
      - run: .venv/bin/python -m pytest crates/cocat-py/tests
