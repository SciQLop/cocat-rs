site_name: cocat
site_description: Shared catalogues of time intervals, for scientists and their students
repo_url: https://github.com/SciQLop/cocat-rs
edit_uri: edit/main/docs/

exclude_docs: |
  superpowers/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Key ideas: concepts.md
  - Guides:
      - Build a catalogue with your team: guides/team-catalogue.md
      - Python and Jupyter: guides/python.md
      - SciQLop: guides/sciqlop.md
      - Bring your catalogues in: guides/import-export.md
      - Community catalogues: guides/public-catalogues.md
      - Catalogues for a paper: guides/paper.md
      - Review rounds: guides/rounds.md
      - Teaching with cocat: guides/teaching.md
  - Reference:
      - Search: reference/search.md
      - Python cheat sheet: reference/python.md
  - Questions and answers: faq.md
  - For server administrators: deploy.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.snippets:
      base_path: [docs/diagrams]
      check_paths: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
